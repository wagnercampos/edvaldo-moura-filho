<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --azul: #1f3a5f;
      --azul-dark: #162d4a;
      --dourado: #dcb045;
      --dourado-hover: #c99c30;
      --branco: #ffffff;
      --fonte-titulo: 'Playfair Display SC', serif;
      --fonte-corpo: 'DM Sans', sans-serif;
      --trans: 0.3s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--fonte-corpo);
      background: linear-gradient(160deg, #0d1b2a 0%, #1f3a5f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* FOTO */
    .foto-wrap {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--dourado);
      box-shadow: 0 0 0 5px rgba(220,176,69,.18);
      margin-bottom: 1.25rem;
      flex-shrink: 0;
    }
    .foto-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    /* NOME E DADOS */
    .nome {
      font-family: var(--fonte-titulo);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--branco);
      text-align: center;
      line-height: 1.2;
      margin-bottom: .35rem;
    }
    .especialidade {
      font-size: .82rem;
      font-weight: 500;
      color: var(--dourado);
      text-align: center;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: .3rem;
    }
    .crm {
      font-size: .75rem;
      color: rgba(255,255,255,.5);
      text-align: center;
      letter-spacing: .05em;
      margin-bottom: 2rem;
    }

    /* DIVISOR */
    .divisor {
      width: 40px;
      height: 2px;
      background: var(--dourado);
      border-radius: 2px;
      margin: 0 auto 2rem;
    }

    /* BOTÕES */
    .btns {
      display: flex;
      flex-direction: column;
      gap: .9rem;
      width: 100%;
      margin-bottom: 2.5rem;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: .85rem;
      width: 100%;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      font-family: var(--fonte-corpo);
      font-size: .95rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform var(--trans), box-shadow var(--trans), background var(--trans);
      cursor: pointer;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,.35);
    }
    .btn:active { transform: translateY(0); }

    .btn-wa {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--branco);
      backdrop-filter: blur(6px);
    }
    .btn-wa:hover {
      background: rgba(255,255,255,.14);
    }

    .btn-site {
      background: var(--dourado);
      color: var(--azul);
      border: 1px solid transparent;
    }
    .btn-site:hover {
      background: var(--dourado-hover);
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon svg {
      width: 20px;
      height: 20px;
    }
    .btn-label { flex: 1; text-align: center; }

    /* LOGO RODAPÉ */
    .logo-rodape {
      margin-top: .5rem;
      margin-bottom: 1.25rem;
    }
    .logo-rodape img {
      height: 72px;
      width: auto;
      display: block;
      margin: 0 auto;
    }

    /* CRÉDITO */
    .credito {
      font-size: .68rem;
      color: rgba(255,255,255,.3);
      text-align: center;
    }
    .credito a {
      color: rgba(220,176,69,.55);
      text-decoration: none;
      transition: color var(--trans);
    }
    .credito a:hover { color: var(--dourado); }

    @media (max-width: 400px) {
      .nome { font-size: 1.3rem; }
      .foto-wrap { width: 92px; height: 92px; }
    }
  </style>
</head>
